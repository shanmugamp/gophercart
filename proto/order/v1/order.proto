syntax = "proto3";

package gophercart.order.v1;

option go_package = "github.com/shanmugamp/gophercart/gen/go/order/v1;orderv1";

service OrderService {
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);

  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);

  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);

  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
}

message Order {
  string id = 1;
  string customer_id = 2;
  repeated OrderItem items = 3;
  int64 total_amount_minor = 4;
  string currency = 5;
  OrderStatus status = 6;
}

message OrderItem {
  string product_id = 1;
  int32 quantity = 2;
  int64 unit_price_minor = 3;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_PAYMENT_PENDING = 2;
  ORDER_STATUS_CONFIRMED = 3;
  ORDER_STATUS_CANCELLED = 4;
  ORDER_STATUS_FAILED = 5;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  string customer_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  int64 total_count = 2;
}

message CreateOrderRequest {
  string customer_id = 1;
  repeated OrderItem items = 2;
  string currency = 3;
}

message CreateOrderResponse {
  Order order = 1;
}

message CancelOrderRequest {
  string order_id = 1;
  string reason = 2;
}

message CancelOrderResponse {
  Order order = 1;
}